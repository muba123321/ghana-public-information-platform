name: Import indicators
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC (GMT, Accra time)
  workflow_dispatch:
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for a production database
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set — no production database yet (Plan 4). Skipping import."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.db.outputs.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: steps.db.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.db.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.db.outputs.skip != 'true'
      - run: pnpm db:seed && pnpm ingest
        if: steps.db.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
